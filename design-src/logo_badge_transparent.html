<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 800px; height: 800px; overflow: hidden; }
  body {
    position: relative;
    background: transparent;
    font-family: Impact, 'Arial Black', sans-serif;
  }
  .hexwrap { position: absolute; inset: 0; }
  .hexwrap svg { width: 100%; height: 100%; }
  .mono {
    position: absolute;
    left: 50%; top: 47%;
    transform: translate(-50%, -50%);
    font-size: 300px;
    letter-spacing: -6px;
    color: #ffffff;
    text-shadow:
      0 0 44px rgba(242,169,0,0.55),
      0 10px 0 #c47800,
      0 18px 36px rgba(0,0,0,0.9);
  }
  .mono span { color: #f2a900; }
  .name {
    position: absolute;
    left: 50%; bottom: 118px;
    transform: translateX(-50%);
    font-size: 54px;
    letter-spacing: 20px;
    color: #f2a900;
    text-shadow: 0 4px 16px rgba(0,0,0,0.9);
  }
</style>
</head>
<body>
  <div class="hexwrap">
    <svg viewBox="0 0 800 800">
      <defs>
        <linearGradient id="hexb" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#f2a900"/>
          <stop offset="1" stop-color="#ff5e00"/>
        </linearGradient>
      </defs>
      <!-- outer hexagon -->
      <polygon points="400,52 702,226 702,574 400,748 98,574 98,226"
               fill="#0e121a" stroke="url(#hexb)" stroke-width="22" stroke-linejoin="round"/>
      <!-- inner hexagon -->
      <polygon points="400,108 654,254 654,546 400,692 146,546 146,254"
               fill="rgba(242,169,0,0.06)" stroke="rgba(242,169,0,0.4)" stroke-width="4" stroke-linejoin="round"/>
      <!-- corner accents -->
      <polyline points="320,52 400,52 480,52" stroke="#ffffff" stroke-width="22" fill="none"/>
      <polyline points="320,748 400,748 480,748" stroke="#ffffff" stroke-width="22" fill="none"/>
      <!-- lightning bolts sides -->
      <path d="M 180 395 l 36 -58 -16 38 30 0 -44 66 14 -46 Z" fill="#f2a900"/>
      <path d="M 584 395 l 36 -58 -16 38 30 0 -44 66 14 -46 Z" fill="#f2a900"/>
    </svg>
  </div>
  <div class="mono">J<span>W</span></div>
  <div class="name">JEETU</div>
</body>
</html>
