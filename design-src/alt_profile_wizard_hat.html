<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 800px; height: 800px; overflow: hidden; }
  body {
    position: relative;
    background:
      radial-gradient(500px 500px at 50% 42%, #1c2230, #0b0e13 75%);
    font-family: Impact, 'Arial Black', sans-serif;
  }
  .ring {
    position: absolute; inset: 24px;
    border-radius: 50%;
    border: 14px solid #f2a900;
    box-shadow:
      0 0 60px rgba(242,169,0,0.45),
      inset 0 0 80px rgba(242,169,0,0.12);
  }
  .ring2 {
    position: absolute; inset: 54px;
    border-radius: 50%;
    border: 3px solid rgba(242,169,0,0.35);
  }
  .letter {
    position: absolute;
    left: 50%; top: 56%;
    transform: translate(-50%, -50%);
    font-size: 430px;
    color: #ffffff;
    text-shadow:
      0 0 40px rgba(242,169,0,0.6),
      0 10px 0 #c47800,
      0 20px 40px rgba(0,0,0,0.9);
  }
  .hat {
    position: absolute;
    left: 50%; top: 30px;
    width: 400px; height: 300px;
    transform: translateX(-54%) rotate(-14deg);
  }
  .spark {
    position: absolute;
    color: #f2a900;
    font-family: Arial, sans-serif;
    text-shadow: 0 0 18px rgba(242,169,0,0.9);
  }
  .sp1 { font-size: 54px; left: 150px; top: 300px; }
  .sp2 { font-size: 36px; right: 160px; top: 250px; }
  .sp3 { font-size: 44px; right: 185px; bottom: 190px; }
  .name {
    position: absolute;
    left: 50%; bottom: 86px;
    transform: translateX(-50%);
    font-size: 58px;
    letter-spacing: 16px;
    color: #f2a900;
    text-shadow: 0 4px 16px rgba(0,0,0,0.9);
  }
</style>
</head>
<body>
  <div class="ring"></div>
  <div class="ring2"></div>

  <div class="letter">J</div>

  <!-- wizard hat -->
  <div class="hat">
    <svg viewBox="0 0 400 300">
      <defs>
        <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#2a3142"/>
          <stop offset="1" stop-color="#141927"/>
        </linearGradient>
        <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#f2a900"/>
          <stop offset="1" stop-color="#ff5e00"/>
        </linearGradient>
      </defs>
      <!-- cone with bent tip -->
      <path d="M 110 235
               C 150 190, 180 120, 196 55
               C 198 40, 205 30, 222 24
               C 240 18, 258 26, 262 38
               C 264 46, 258 52, 250 50
               C 242 48, 240 40, 233 44
               C 224 50, 222 62, 220 75
               C 214 135, 255 195, 292 235 Z"
            fill="url(#cone)" stroke="#f2a900" stroke-width="5" stroke-linejoin="round"/>
      <!-- band -->
      <path d="M 128 212 C 170 228, 240 228, 276 214 L 288 232 C 240 250, 162 250, 116 230 Z"
            fill="url(#band)"/>
      <!-- brim -->
      <ellipse cx="200" cy="243" rx="165" ry="30"
               fill="url(#cone)" stroke="#f2a900" stroke-width="6"/>
      <!-- star on cone -->
      <path d="M 196 120 l 7 16 17 2 -12 12 3 17 -15 -8 -15 8 3 -17 -12 -12 17 -2 Z"
            fill="#f2a900"/>
    </svg>
  </div>

  <div class="spark sp1">✦</div>
  <div class="spark sp2">✦</div>
  <div class="spark sp3">✦</div>

  <div class="name">JEETU</div>
</body>
</html>
